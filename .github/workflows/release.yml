name: 'Release Tauri Template App'

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  publish-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false

    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9 # Required: specify the pnpm version (or use 'latest')

      - name: Install frontend dependencies
        run: pnpm install

      - name: Create Multi-Build Script
        shell: bash
        run: |
          cat << 'EOF' > build-all.js
          const { execSync } = require('child_process');
          const fs = require('fs');
          const file = 'src-tauri/tauri.conf.json';

          // Capture arguments passed by tauri-action (e.g., --bundles msi)
          const passedArgs = process.argv.slice(2).join(' ');

          function setConfig(mode, suffix) {
            const cfg = JSON.parse(fs.readFileSync(file, 'utf8'));
            const isV2 = !cfg.tauri;
            const bundle = isV2 ? (cfg.bundle = cfg.bundle || {}) : (cfg.tauri.bundle = cfg.tauri.bundle || {});
            bundle.windows = bundle.windows || {};
            bundle.windows.webviewInstallMode = bundle.windows.webviewInstallMode || {};
            bundle.windows.webviewInstallMode.type = bundle.windows.webviewInstallMode.type || {};
            bundle.windows.webviewInstallMode.type = mode;

            if (suffix) {
              if (cfg.productName && !cfg.productName.endsWith(suffix)) cfg.productName += suffix;
            }
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
          }

          const originalConfig = fs.readFileSync(file, 'utf8');

          try {
            console.log('--- Building Standard MSI (Downloads WebView2) ---');
            setConfig('downloadBootstrapper', '');
            execSync(`pnpm tauri build ${passedArgs}`, { stdio: 'inherit' });

            console.log('--- Building Offline MSI (Bundles WebView2) ---');
            setConfig('offlineInstaller', ' Offline');
            execSync(`pnpm tauri build ${passedArgs}`, { stdio: 'inherit' });
          } finally {
            // Always restore original config file
            fs.writeFileSync(file, originalConfig);
          }
          EOF


      - name: Build and release
        uses: tauri-apps/tauri-action@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name || inputs.version }}
          releaseName: 'Tauri Template App ${{ github.ref_name || inputs.version }}'
          releaseBody: |
            ## Tauri Template App ${{ github.ref_name || inputs.version }}

            ### Installation Instructions
            - **Standard Installer**: Download the standard `.msi` file. Requires an internet connection during setup to download WebView2 if missing.
            - **Offline Installer (`-Offline.msi`)**: Fully self-contained installer. Bundles WebView2; works without an active internet connection.

            ### Auto-Updates
            Existing users will receive automatic update notifications.

            **Full Changelog**: https://github.com/${{ github.repository }}/commits/${{ github.ref_name || inputs.version }}
          releaseDraft: true
          prerelease: false
          uploadUpdaterJson: true
          args: '--bundles msi'
