<div class="w-[300px] h-1 bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-secondary-container progress-fill" id="splash-progress"></div>

<!-- Footer -->
<footer class="pb-10 w-full flex justify-center">
<p class="font-body-sm text-body-sm text-on-surface-variant opacity-50">

        </p>

<!-- Initialization & Mock Progress Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const progressBar = document.getElementById('splash-progress');
            let progress = 0;
            
            // Simulating a smooth loading sequence
            const interval = setInterval(() => {
                // Varying speed for more "realistic" feel
                const increment = Math.random() * 5 + 1;
                progress += increment;
                
                if (progress >= 100) {
                    progress = 100;
                    progressBar.style.width = '100%';
                    clearInterval(interval);
                    
                    // Optional: Trigger transition to main dashboard after a brief pause
                    setTimeout(() => {
                        console.log('App ready');
                        // In a real app, logic for window.location.href or state change would go here
                    }, 500);
                } else {
                    progressBar.style.width = `${progress}%`;
                }
            }, 80);
        });
    </script>
</body></html>
