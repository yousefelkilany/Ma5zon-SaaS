<!doctype html>

<html class="dark" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>AccuLedger - Secure Sign In</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
      rel="stylesheet"
    />
    <script id="tailwind-config">
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              'on-primary-container': '#798098',
              'surface-container': '#102034',
              'on-secondary': '#003824',
              'on-error': '#690005',
              'on-background': '#d3e4fe',
              'tertiary-fixed': '#ffdada',
              tertiary: '#ffb3b6',
              'surface-container-highest': '#26364a',
              'on-secondary-fixed-variant': '#005236',
              'on-secondary-container': '#00311f',
              'on-tertiary-fixed-variant': '#920028',
              'on-tertiary': '#68001a',
              'secondary-fixed': '#6ffbbe',
              'on-surface-variant': '#c6c6cd',
              error: '#ffb4ab',
              'on-surface': '#d3e4fe',
              'secondary-container': '#00a572',
              'surface-bright': '#2a3a4f',
              primary: '#bec6e0',
              'on-primary-fixed': '#131b2e',
              surface: '#031427',
              'tertiary-fixed-dim': '#ffb3b6',
              'surface-tint': '#bec6e0',
              'inverse-surface': '#d3e4fe',
              'outline-variant': '#45464d',
              'surface-dim': '#031427',
              'on-primary': '#283044',
              'primary-fixed-dim': '#bec6e0',
              'surface-container-lowest': '#000f21',
              'primary-fixed': '#dae2fd',
              'surface-variant': '#26364a',
              'primary-container': '#0f172a',
              'on-primary-fixed-variant': '#3f465c',
              'inverse-on-surface': '#213145',
              secondary: '#4edea3',
              'on-tertiary-fixed': '#40000c',
              background: '#031427',
              'error-container': '#93000a',
              'on-error-container': '#ffdad6',
              outline: '#909097',
              'on-secondary-fixed': '#002113',
            },
            borderRadius: {
              DEFAULT: '0.125rem',
              lg: '0.25rem',
              xl: '0.5rem',
              full: '0.75rem',
            },
            spacing: {
              'compact-padding': '0.75rem',
              'cozy-padding': '1.5rem',
              'compact-gap': '0.5rem',
              gutter: '1rem',
              'margin-edge': '2rem',
              'cozy-gap': '1rem',
            },
            fontFamily: {
              'body-sm': ['Inter'],
              'data-tabular': ['Inter'],
              'headline-sm': ['Inter'],
              'headline-lg': ['Inter'],
              'body-lg': ['Inter'],
              'headline-md': ['Inter'],
              'body-md': ['Inter'],
              'label-caps': ['Inter'],
            },
            fontSize: {
              'body-sm': ['13px', { lineHeight: '1.5', fontWeight: '400' }],
              'data-tabular': ['14px', { lineHeight: '1', fontWeight: '500' }],
              'headline-sm': ['20px', { lineHeight: '1.4', fontWeight: '500' }],
              'headline-lg': [
                '32px',
                {
                  lineHeight: '1.2',
                  letterSpacing: '-0.02em',
                  fontWeight: '600',
                },
              ],
              'body-lg': ['16px', { lineHeight: '1.6', fontWeight: '400' }],
              'headline-md': ['24px', { lineHeight: '1.3', fontWeight: '600' }],
              'body-md': ['14px', { lineHeight: '1.5', fontWeight: '400' }],
              'label-caps': [
                '11px',
                { lineHeight: '1', letterSpacing: '0.05em', fontWeight: '700' },
              ],
            },
          },
        },
      }
    </script>
    <style>
      .material-symbols-outlined {
        font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        vertical-align: middle;
      }
      body {
        background-color: #031427; /* Fallback to theme surface color */
      }
      .login-overlay {
        background: radial-gradient(
          circle at center,
          rgba(15, 23, 42, 0.8) 0%,
          rgba(3, 20, 39, 1) 100%
        );
      }
    </style>
  </head>
  <body
    class="bg-surface text-on-surface font-body-md min-h-screen flex items-center justify-center p-gutter"
  >
    <!-- Global Background Shell (Simulation) -->
    <div class="fixed inset-0 login-overlay z-0"></div>
    <!-- Login Modal -->
    <main
      class="relative z-10 w-full max-w-100 bg-surface-container border border-outline-variant rounded shadow-2xl overflow-hidden transition-all duration-300"
    >
      <!-- Header Section -->
      <div class="px-cozy-padding pt-cozy-padding pb-gutter text-center">
        <div class="mb-gutter flex justify-center">
          <img
            alt="AccuLedger Logo"
            class="h-16 w-16 object-contain"
            src="https://lh3.googleusercontent.com/aida/ADBb0ugC97BiMp7152g0s4xeQFfBs0o-AevGPY-nGTTvUTX9OdJIehlRkx0CVNx7EmrThp8Yurfq61JVjfhwlHqsBdso3-o_R11zW_NYvWMI5_XcOdgXGwqiezOQSw3vqzGgCjRN1LxixBrJ40RFyv4kvnggWQ4F4tmNHlthl1MXaKLYnzHaVluAFpCzF0mnDglaKh4ij4wOU6koci9Yv1DrsiVTPnv1wqMbBMX6481ptNSWqUAegzb9Xejqyso"
          />
        </div>
        <h1 class="text-headline-sm font-headline-sm text-on-surface">
          Sign In to AccuLedger
        </h1>
        <p class="text-on-surface-variant text-body-sm mt-1">
          Enterprise Financial Management System
        </p>
      </div>
      <!-- Form Section -->
      <div class="px-cozy-padding pb-cozy-padding">
        <form class="space-y-gutter" id="loginForm">
          <!-- Username Field -->
          <div class="space-y-2">
            <label
              class="text-label-caps font-label-caps text-on-surface-variant uppercase"
              for="username"
              >Username</label
            >
            <div class="relative group">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface px-4 py-3 rounded focus:ring-2 focus:ring-secondary focus:border-transparent transition-all outline-none text-body-md placeholder:text-on-surface-variant/30"
                id="username"
                name="username"
                placeholder="e.g. j.smith"
                required=""
                type="text"
              />
            </div>
          </div>
          <!-- Password Field -->
          <div class="space-y-2">
            <label
              class="text-label-caps font-label-caps text-on-surface-variant uppercase"
              for="password"
              >Password</label
            >
            <div class="relative group">
              <input
                class="w-full bg-surface-container-lowest border border-outline-variant text-on-surface px-4 py-3 rounded pr-12 focus:ring-2 focus:ring-secondary focus:border-transparent transition-all outline-none text-body-md placeholder:text-on-surface-variant/30"
                id="password"
                name="password"
                placeholder="••••••••"
                required=""
                type="password"
              />
              <button
                aria-label="Toggle password visibility"
                class="absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant hover:text-secondary transition-colors"
                id="togglePassword"
                type="button"
              >
                <span class="material-symbols-outlined" id="eyeIcon"
                  >visibility</span
                >
              </button>
            </div>
          </div>
          <!-- Subtle Error Message Area -->
          <div
            class="hidden flex items-center gap-2 text-error-container bg-error-container/10 p-compact-padding rounded border border-error-container/20"
            id="errorMessage"
          >
            <span class="material-symbols-outlined text-[16px]">error</span>
            <span class="text-body-sm"
              >Invalid credentials. Please try again.</span
            >
          </div>
          <!-- Controls -->
          <div class="flex items-center justify-between">
            <label class="flex items-center gap-2 cursor-pointer group">
              <input
                class="w-4 h-4 rounded-sm border-outline-variant bg-surface-container-lowest text-secondary focus:ring-secondary focus:ring-offset-surface-container"
                type="checkbox"
              />
              <span
                class="text-body-sm text-on-surface-variant group-hover:text-on-surface transition-colors"
                >Remember me</span
              >
            </label>
            <a
              class="text-body-sm text-secondary hover:underline transition-all"
              href="#"
              >Forgot?</a
            >
          </div>
          <!-- Submit Button -->
          <button
            class="w-full bg-secondary text-on-secondary font-headline-sm py-3 rounded hover:brightness-110 active:scale-[0.98] transition-all flex items-center justify-center gap-2 shadow-lg shadow-secondary/10"
            type="submit"
          >
            <span class="material-symbols-outlined">lock_open</span>
            <span>Sign In</span>
          </button>
        </form>
      </div>
      <!-- Security Footer -->
      <div
        class="bg-surface-container-low px-cozy-padding py-compact-padding flex items-center justify-center gap-2 border-t border-outline-variant/30"
      >
        <span
          class="material-symbols-outlined text-on-surface-variant text-[14px]"
          >verified_user</span
        >
        <span class="text-label-caps text-on-surface-variant uppercase"
          >256-bit AES Encrypted Connection</span
        >
      </div>
    </main>
    <script>
      // Micro-interactions for Login Modal
      const passwordInput = document.getElementById('password')
      const toggleButton = document.getElementById('togglePassword')
      const eyeIcon = document.getElementById('eyeIcon')
      const loginForm = document.getElementById('loginForm')
      const errorArea = document.getElementById('errorMessage')

      // Toggle Password Visibility
      toggleButton.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password'
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password')
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility'
      })

      // Mock Login Interaction
      loginForm.addEventListener('submit', e => {
        e.preventDefault()
        const btn = e.target.querySelector('button[type="submit"]')
        const originalContent = btn.innerHTML

        // Show loading state
        btn.innerHTML =
          '<span class="material-symbols-outlined animate-spin">refresh</span> <span>Authenticating...</span>'
        btn.disabled = true
        errorArea.classList.add('hidden')

        // Simulate server delay
        setTimeout(() => {
          btn.innerHTML = originalContent
          btn.disabled = false
          // Show error state as requested in prompt
          errorArea.classList.remove('hidden')

          // Add shake effect to modal
          const modal = document.querySelector('main')
          modal.classList.add('animate-shake')
          setTimeout(() => modal.classList.remove('animate-shake'), 500)
        }, 1200)
      })
    </script>
    <style>
      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-4px);
        }
        75% {
          transform: translateX(4px);
        }
      }
      .animate-shake {
        animation: shake 0.2s cubic-bezier(0.36, 0.07, 0.19, 0.97) both;
        border-color: #ffb4ab;
      }
    </style>
  </body>
</html>
